<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="Chef Wars — cook, serve and conquer in a fast-paced restaurant arcade game." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Chef Wars</title>

    <!-- Inline SVG favicon (no external file) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ffc94a' d='M7 3a4 4 0 0 0-2 7.5V21h4V10.5A4 4 0 0 0 7 3zm10 0c-2 0-3.5 2-3.5 4.5S15 12 15 12v9h4V3z'/%3E%3C/svg%3E"
    />

    <!-- Game styles -->
    <link rel="stylesheet" href="./style.css" />

    <!-- CrazyGames SDK v3 — optional. The game detects it and degrades
         gracefully to offline mode anywhere else (itch, your own site, local). -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" defer></script>

    <!-- Phaser 3.60 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  </head>

  <body>
    <!-- The Phaser canvas mounts here and fills the viewport -->
    <div id="game-container" aria-label="Chef Wars game"></div>

    <!-- Instant HTML splash so the very first frame is never a blank page -->
    <div id="splash">
      <div class="splash-logo">CHEF<span>WARS</span></div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-tip">Loading the kitchen…</div>
    </div>

    <!-- Portrait-phone prompt -->
    <div id="rotate">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="2" width="16" height="20" rx="3" />
        <path d="M2 14a10 10 0 0 0 10 8" />
        <path d="m2 14 3 2m-3-2 2-3" />
      </svg>
      <p>Rotate your device</p>
      <small>Chef Wars plays best in landscape</small>
    </div>

    <!-- Game code (ES module; Vite inlines every import into one file) -->
    <script type="module" src="./game.js"></script>
  </body>
</html>
